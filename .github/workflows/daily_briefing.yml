name: Daily WhatsApp Briefing & Supabase Keep-Alive

on:
  schedule:
    # Set to 10:00 AM UTC (which is 3:30 PM IST for testing!)
    - cron: '00 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Run Daily Briefing & Keep-Alive Script
        run: node scripts/send_daily_briefing.js
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PRINCIPAL_PHONE: '917996207208'
